{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <div class="mb-2">
                    <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                </div>
                <h3 class="fw-bold text-body">CampusCare</h3>
                <p class="text-muted small">Select your portal to log in</p>
            </div>

            <!-- Role Selection Tabs -->
            <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="loginTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-3 py-2 fw-semibold" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-pane" type="button" role="tab">Student</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-3 py-2 fw-semibold" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-pane" type="button" role="tab">Admin</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-3 py-2 fw-semibold" id="committee-tab" data-bs-toggle="tab" data-bs-target="#committee-pane" type="button" role="tab">Committee</button>
                </li>
            </ul>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger py-2 small" role="alert">
                  {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <!-- Tab Content -->
            <div class="tab-content" id="loginTabsContent">
                
                <!-- 1. STUDENT LOGIN FORM -->
                <div class="tab-pane fade show active" id="student-pane" role="tabpanel">
                    <form method="POST" action="{{ url_for('login') }}">
                        <input type="hidden" name="role" value="student">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control password-field" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show or hide password">
                                    Show
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Login as Student →</button>
                    </form>
                </div>

                <!-- 2. ADMIN LOGIN FORM -->
                <div class="tab-pane fade" id="admin-pane" role="tabpanel">
                    <form method="POST" action="{{ url_for('login') }}">
                        <input type="hidden" name="role" value="admin">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Admin Email</label>
                            <input type="email" name="email" class="form-control" placeholder="admin@campuscare.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control password-field" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show or hide password">
                                    Show
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold shadow-sm">Login as Admin →</button>
                    </form>
                </div>

                <!-- 3. COMMITTEE LOGIN FORM -->
                <div class="tab-pane fade" id="committee-pane" role="tabpanel">
                    <form method="POST" action="{{ url_for('login') }}">
                        <input type="hidden" name="role" value="committee">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Committee Email</label>
                            <input type="email" name="email" class="form-control" placeholder="committee@campuscare.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control password-field" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show or hide password">
                                    Show
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">Login as Committee →</button>
                    </form>
                </div>

            </div>

            <div class="text-center mt-4">
                <p class="small text-muted mb-0">Don't have a student account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll(".toggle-password").forEach((button) => {
    button.addEventListener("click", () => {
        const input = button.closest(".input-group").querySelector(".password-field");
        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        button.textContent = isPassword ? "Hide" : "Show";
    });
});
</script>
{% endblock %}
