
{% extends "base.html" %}

{% block title %}Login | CampusCare{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5Z"/>
                    <path d="m8.5 12 2.3 2.3 4.8-4.8"/>
                </svg>
            </span>
            <span>CampusCare</span>
        </div>

        <div class="auth-heading">
            <p class="section-eyebrow">WELCOME BACK</p>
            <h1>Login to your account</h1>
            <p>Access your college complaint portal.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control auth-input"
                       id="email" name="email"
                       placeholder="you@example.com" required>
            </div>

          
<div class="mb-4">
    <label for="password" class="form-label">Password</label>

    <div class="password-field">
        <input
            type="password"
            class="form-control auth-input"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

        <button
            type="button"
            class="password-toggle"
            data-password-toggle="password"
            aria-controls="password"
            aria-label="Show password"
            aria-pressed="false">
            Show
        </button>
    </div>
</div>


            <button type="submit"
                    class="btn btn-primary auth-submit w-100">
                Login to CampusCare →
            </button>
        </form>

        <div class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create an account</a>
        </div>

        <p class="auth-security">
            Your account helps keep college complaints organized.
        </p>

    </div>
</div>
{% endblock %}
