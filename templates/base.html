<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}CampusCare | College Complaints{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="{{ url_for('static', filename='css/style.css') }}"
          rel="stylesheet">
</head>

<body class="campus-body">

<nav class="navbar navbar-expand-lg campus-navbar">
    <div class="container">
        <a class="navbar-brand campus-brand" href="{{ url_for('index') }}">
            <span class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5Z"/>
                    <path d="m8.5 12 2.3 2.3 4.8-4.8"/>
                </svg>
            </span>
            CampusCare
        </a>

        {% if session.get('user_id') %}
        <div class="d-flex align-items-center gap-3">
            <!-- Dark Mode Toggle Button -->
            <button type="button" id="darkModeToggle" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 d-flex align-items-center gap-2" title="Toggle Dark/Light Mode">
                <span id="darkModeIcon">🌙</span> <span id="darkModeText" class="small fw-semibold">Dark</span>
            </button>

            <div class="user-info d-none d-sm-flex align-items-center gap-2">
                <span class="user-name fw-semibold">{{ session.get('name') }}</span>
                <span class="user-role badge rounded-pill text-bg-light border">{{ session.get('role')|title }}</span>
            </div>

            <a class="btn btn-outline-secondary btn-sm rounded-3 px-3 py-1 fw-semibold" href="{{ url_for('logout') }}">
                Logout <span aria-hidden="true">↗</span>
            </a>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container campus-main">

    {% for message in get_flashed_messages() %}
        <div class="alert alert-info campus-alert alert-dismissible fade show"
             role="alert">
            <span class="me-2" aria-hidden="true">ⓘ</span>
            {{ message }}
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}

    {% block content %}{% endblock %}

    <footer class="campus-footer">
        <span>CampusCare</span>
        <span>•</span>
        <span>College Complaint Management System</span>
    </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
    button.addEventListener("click", function () {
        const inputId = button.getAttribute("data-password-toggle");
        const passwordInput = document.getElementById(inputId);

        if (!passwordInput) return;

        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
        button.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
        button.setAttribute("aria-pressed", String(isHidden));
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const search = document.getElementById("complaintSearch");
    const status = document.getElementById("statusFilter");
    const category = document.getElementById("categoryFilter");
    const reset = document.getElementById("resetComplaintFilters");
    const results = document.getElementById("filterResultsText");
    const count = document.getElementById("complaintCount");

    if (!search || !status || !category || !reset) return;

    const rows = Array.from(document.querySelectorAll(".complaint-row"));
    const originalCount = rows.length;

    function applyFilters() {
        const query = search.value.trim().toLowerCase();
        const selectedStatus = status.value;
        const selectedCategory = category.value;
        let visible = 0;

        rows.forEach(function (row) {
            const matchesSearch =
                row.dataset.title.includes(query) ||
                row.dataset.reference.toLowerCase().includes(query);

            const matchesStatus =
                !selectedStatus || row.dataset.status === selectedStatus;

            const matchesCategory =
                !selectedCategory || row.dataset.category === selectedCategory;

            const show = matchesSearch && matchesStatus && matchesCategory;
            row.hidden = !show;

            if (show) visible++;
        });

        if (results) {
            results.textContent = `Showing ${visible} of ${originalCount} complaints`;
        }

        if (count) {
            count.textContent = `${visible} of ${originalCount} total`;
        }
    }

    search.addEventListener("input", applyFilters);
    status.addEventListener("change", applyFilters);
    category.addEventListener("change", applyFilters);

    reset.addEventListener("click", function () {
        search.value = "";
        status.value = "";
        category.value = "";
        applyFilters();
    });

    applyFilters();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const search = document.getElementById("adminComplaintSearch");
    const status = document.getElementById("adminStatusFilter");
    const category = document.getElementById("adminCategoryFilter");
    const reset = document.getElementById("adminResetFilters");
    const results = document.getElementById("adminFilterResultsText");
    const count = document.getElementById("adminComplaintCount");
    const noMatches = document.getElementById("adminNoMatches");

    if (!search || !status || !category || !reset) return;

    const rows = Array.from(
        document.querySelectorAll(".admin-complaint-row")
    );
    const originalCount = rows.length;

    function applyAdminFilters() {
        const query = search.value.trim().toLowerCase();
        const selectedStatus = status.value;
        const selectedCategory = category.value;
        let visible = 0;

        rows.forEach(function (row) {
            const searchableText = [
                row.dataset.title,
                row.dataset.reference,
                row.dataset.student,
                row.dataset.email
            ].join(" ");

            const matchesSearch = searchableText.includes(query);
            const matchesStatus =
                !selectedStatus || row.dataset.status === selectedStatus;
            const matchesCategory =
                !selectedCategory || row.dataset.category === selectedCategory;

            const show = matchesSearch && matchesStatus && matchesCategory;
            row.hidden = !show;

            if (show) visible++;
        });

        if (results) {
            results.textContent =
                `Showing ${visible} of ${originalCount} complaints`;
        }

        if (count) {
            count.textContent = `${visible} of ${originalCount} records`;
        }

        if (noMatches) {
            noMatches.hidden = visible !== 0 || originalCount === 0;
        }
    }

    search.addEventListener("input", applyAdminFilters);
    status.addEventListener("change", applyAdminFilters);
    category.addEventListener("change", applyAdminFilters);

    reset.addEventListener("click", function () {
        search.value = "";
        status.value = "";
        category.value = "";
        applyAdminFilters();
    });

    applyAdminFilters();
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggleBtn = document.getElementById("darkModeToggle");
    const iconSpan = document.getElementById("darkModeIcon");
    const textSpan = document.getElementById("darkModeText");
    const htmlElement = document.documentElement;

    const savedTheme = localStorage.getItem("campuscare_theme") || "light";
    htmlElement.setAttribute("data-bs-theme", savedTheme);
    updateToggleUI(savedTheme);

    if (toggleBtn) {
        toggleBtn.addEventListener("click", function () {
            const currentTheme = htmlElement.getAttribute("data-bs-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";

            htmlElement.setAttribute("data-bs-theme", newTheme);
            localStorage.setItem("campuscare_theme", newTheme);
            updateToggleUI(newTheme);
        });
    }

    function updateToggleUI(theme) {
        if (theme === "dark") {
            iconSpan.textContent = "☀️";
            textSpan.textContent = "Light";
        } else {
            iconSpan.textContent = "🌙";
            textSpan.textContent = "Dark";
        }
    }
});
</script>

</body>
</html>
